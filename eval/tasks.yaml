# Evaluation Task Suite
# Structured task definitions for the eval harness
# See tasks.md for detailed documentation

tasks:
  # ===========================================
  # Task Family 1: Transformer Architecture
  # ===========================================

  T1.1:
    family: Transformer
    type: primary
    prompt: "Find the seminal papers on attention mechanisms in deep learning, particularly for sequence-to-sequence models and transformers."
    ground_truth:
      - paper: "Vaswani et al. 2017"
        matchers:
          - "1706.03762"
          - "Attention Is All You Need"
          - "Vaswani.*2017"
      - paper: "Bahdanau et al. 2014"
        matchers:
          - "1409.0473"
          - "Neural Machine Translation by Jointly Learning"
          - "Bahdanau.*2014"
      - paper: "Luong et al. 2015"
        matchers:
          - "1508.04025"
          - "Effective Approaches to Attention-based"
          - "Luong.*2015"
    success_threshold: 2
    related_task: T1.2
    warm_index_entries:
      - description: "Vaswani et al. 2017 - Attention Is All You Need. Introduces Transformer architecture with self-attention mechanism, multi-head attention, positional encoding. Foundational paper for modern NLP."
        resource: "https://arxiv.org/abs/1706.03762"
      - description: "Bahdanau et al. 2014 - Neural Machine Translation by Jointly Learning to Align and Translate. Introduces attention mechanism for sequence-to-sequence models."
        resource: "https://arxiv.org/abs/1409.0473"
      - description: "Luong et al. 2015 - Effective Approaches to Attention-based Neural Machine Translation. Compares global vs local attention mechanisms."
        resource: "https://arxiv.org/abs/1508.04025"
      - description: "Sutskever et al. 2014 - Sequence to Sequence Learning with Neural Networks. Foundational encoder-decoder architecture using LSTMs for sequence transduction."
        resource: "https://arxiv.org/abs/1409.3215"
      - description: "Cheng et al. 2016 - Long Short-Term Memory-Networks for Machine Reading. First introduction of self-attention (intra-attention) within sequences."
        resource: "https://arxiv.org/abs/1601.06733"
      - description: "Xu et al. 2015 - Show, Attend and Tell: Neural Image Caption Generation with Visual Attention. Extended attention mechanisms to computer vision with spatial attention."
        resource: "https://arxiv.org/abs/1502.03044"

  T1.2:
    family: Transformer
    type: related
    primary_task: T1.1
    prompt: "Find papers on positional encoding approaches for transformers - how do transformer models encode sequence position information?"
    ground_truth:
      - paper: "Vaswani et al. 2017"
        matchers:
          - "1706.03762"
          - "Attention Is All You Need"
          - "Vaswani.*2017"
      - paper: "Su et al. 2021 (RoFormer)"
        matchers:
          - "2104.09864"
          - "RoFormer"
          - "Rotary Position Embedding"
          - "Su.*2021"
      - paper: "Press et al. 2021 (ALiBi)"
        matchers:
          - "2108.12409"
          - "ALiBi"
          - "Train Short.*Test Long"
          - "Press.*2021"
    success_threshold: 2
    # Uses T1.1's warm_index_entries for related-warm condition

  # ===========================================
  # Task Family 2: Code Generation
  # ===========================================

  T2.1:
    family: CodeGeneration
    type: primary
    prompt: "Find important papers and resources on using neural networks for code generation and program synthesis."
    ground_truth:
      - paper: "Chen et al. 2021 (Codex)"
        matchers:
          - "2107.03374"
          - "Codex"
          - "Evaluating Large Language Models Trained on Code"
          - "Chen.*2021.*code"
      - paper: "Li et al. 2022 (AlphaCode)"
        matchers:
          - "2203.07814"
          - "AlphaCode"
          - "Competition-Level Code Generation"
          - "Li.*2022.*code"
      - paper: "Austin et al. 2021"
        matchers:
          - "2108.07732"
          - "Program Synthesis with Large Language Models"
          - "Austin.*2021"
    success_threshold: 2
    related_task: T2.2
    warm_index_entries:
      - description: "Chen et al. 2021 - Codex: Evaluating Large Language Models Trained on Code. Introduces Codex model, HumanEval benchmark, code generation from docstrings."
        resource: "https://arxiv.org/abs/2107.03374"
      - description: "Li et al. 2022 - AlphaCode: Competition-Level Code Generation. Achieves competitive programming performance, large-scale sampling and filtering approach."
        resource: "https://arxiv.org/abs/2203.07814"
      - description: "Austin et al. 2021 - Program Synthesis with Large Language Models. Evaluates LLMs on program synthesis benchmarks, MBPP dataset."
        resource: "https://arxiv.org/abs/2108.07732"

  T2.2:
    family: CodeGeneration
    type: related
    primary_task: T2.1
    prompt: "Find benchmarks and evaluation datasets used for measuring code generation capabilities of language models."
    ground_truth:
      - paper: "Chen et al. 2021 (HumanEval)"
        matchers:
          - "2107.03374"
          - "HumanEval"
          - "Codex"
          - "Chen.*2021"
      - paper: "Hendrycks et al. 2021 (APPS)"
        matchers:
          - "2105.09938"
          - "APPS"
          - "Measuring Coding Challenge Competence"
          - "Hendrycks.*2021"
      - paper: "Lu et al. 2021 (CodeXGLUE)"
        matchers:
          - "2102.04664"
          - "CodeXGLUE"
          - "Lu.*2021.*code"
    success_threshold: 2
    # Uses T2.1's warm_index_entries for related-warm condition

  # ===========================================
  # Task Family 3: Retrieval-Augmented Generation
  # ===========================================

  T3.1:
    family: RAG
    type: primary
    prompt: "Find papers on retrieval-augmented generation (RAG) - combining retrieval systems with language models for knowledge-grounded generation."
    ground_truth:
      - paper: "Lewis et al. 2020 (RAG)"
        matchers:
          - "2005.11401"
          - "Retrieval-Augmented Generation for Knowledge-Intensive"
          - "Lewis.*2020.*retrieval"
      - paper: "Borgeaud et al. 2022 (RETRO)"
        matchers:
          - "2112.04426"
          - "RETRO"
          - "Retrieving from Trillions of Tokens"
          - "Borgeaud.*2022"
      - paper: "Izacard & Grave 2020"
        matchers:
          - "2007.01282"
          - "Leveraging Passage Retrieval with Generative Models"
          - "Izacard.*2020"
    success_threshold: 2
    related_task: T3.2
    warm_index_entries:
      - description: "Lewis et al. 2020 - RAG: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks. Combines retrieval with generation, uses dense passage retrieval with seq2seq model."
        resource: "https://arxiv.org/abs/2005.11401"
      - description: "Borgeaud et al. 2022 - RETRO: Improving Language Models by Retrieving from Trillions of Tokens. Retrieval-enhanced transformer, nearest neighbor retrieval at scale."
        resource: "https://arxiv.org/abs/2112.04426"
      - description: "Izacard & Grave 2020 - Leveraging Passage Retrieval with Generative Models for Open Domain Question Answering. Fusion-in-Decoder approach, retrieval for QA."
        resource: "https://arxiv.org/abs/2007.01282"

  T3.2:
    family: RAG
    type: related
    primary_task: T3.1
    prompt: "Find resources on vector databases and approximate nearest neighbor search for building RAG systems."
    ground_truth:
      - paper: "FAISS"
        matchers:
          - "FAISS"
          - "Facebook AI Similarity Search"
          - "faiss"
      - paper: "Johnson et al. 2017"
        matchers:
          - "1702.08734"
          - "Billion-scale similarity search"
          - "Johnson.*2017.*similarity"
      - paper: "Any major vector DB"
        matchers:
          - "Pinecone"
          - "Weaviate"
          - "Milvus"
          - "Qdrant"
          - "Chroma"
    success_threshold: 2
    # Uses T3.1's warm_index_entries for related-warm condition

  # ===========================================
  # Task Family 4: Documentation Lookup
  # ===========================================

  T4.1:
    family: Documentation
    type: primary
    prompt: "Find documentation on React hooks - specifically useEffect, useState, and useCallback."
    ground_truth:
      - paper: "React useEffect docs"
        matchers:
          - "react.dev.*useEffect"
          - "reactjs.org.*useEffect"
          - "useEffect.*hook"
      - paper: "React useState docs"
        matchers:
          - "react.dev.*useState"
          - "reactjs.org.*useState"
          - "useState.*hook"
      - paper: "React useCallback docs"
        matchers:
          - "react.dev.*useCallback"
          - "reactjs.org.*useCallback"
          - "useCallback.*hook"
    success_threshold: 2
    related_task: T4.2
    warm_index_entries:
      - description: "React useEffect Hook - Official documentation for useEffect, the Effect Hook for performing side effects in function components. Covers cleanup, dependencies, and common patterns."
        resource: "https://react.dev/reference/react/useEffect"
      - description: "React useState Hook - Official documentation for useState, the State Hook for adding state to function components. Covers initial state, updating state, and functional updates."
        resource: "https://react.dev/reference/react/useState"
      - description: "React useCallback Hook - Official documentation for useCallback, a hook that returns a memoized callback function. Useful for optimizing child component re-renders."
        resource: "https://react.dev/reference/react/useCallback"
      - description: "React useMemo Hook - Official documentation for useMemo, a hook that memoizes expensive computations between re-renders."
        resource: "https://react.dev/reference/react/useMemo"
      - description: "React Hooks Overview - Introduction to Hooks, rules of hooks, and the motivation behind the Hooks API in React."
        resource: "https://react.dev/reference/react/hooks"

  T4.2:
    family: Documentation
    type: related
    primary_task: T4.1
    prompt: "Find documentation on React performance optimization - memoization, lazy loading, and preventing unnecessary re-renders."
    ground_truth:
      - paper: "React.memo docs"
        matchers:
          - "react.dev.*memo"
          - "React.memo"
          - "memo.*component"
      - paper: "React.lazy docs"
        matchers:
          - "react.dev.*lazy"
          - "React.lazy"
          - "lazy.*loading"
          - "code.*splitting"
      - paper: "useMemo or useCallback"
        matchers:
          - "useMemo"
          - "useCallback"
          - "memoiz"
    success_threshold: 2
    # Uses T4.1's warm_index_entries for related-warm condition

  # ===========================================
  # Task Family 5: Rust Language Concepts
  # ===========================================

  T5.1:
    family: RustLang
    type: primary
    prompt: "Find documentation and resources explaining Rust's ownership system - ownership, borrowing, and lifetimes."
    ground_truth:
      - paper: "Rust Book Ownership"
        matchers:
          - "doc.rust-lang.org.*ownership"
          - "rust-lang.*book.*ownership"
          - "ownership.*Rust"
      - paper: "Rust Book Borrowing"
        matchers:
          - "doc.rust-lang.org.*borrowing"
          - "doc.rust-lang.org.*references"
          - "borrow.*checker"
          - "references.*borrowing"
      - paper: "Rust Book Lifetimes"
        matchers:
          - "doc.rust-lang.org.*lifetimes"
          - "lifetime.*annotation"
          - "'a.*lifetime"
    success_threshold: 2
    related_task: T5.2
    warm_index_entries:
      - description: "Rust Book - Understanding Ownership. Core concept in Rust: each value has a single owner, ownership can be transferred (moved), and values are dropped when owner goes out of scope."
        resource: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html"
      - description: "Rust Book - References and Borrowing. Explains how to use references (&T and &mut T) to borrow values without taking ownership. Covers borrowing rules and the borrow checker."
        resource: "https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"
      - description: "Rust Book - Validating References with Lifetimes. Covers lifetime annotations, lifetime elision rules, and how the compiler ensures references are always valid."
        resource: "https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html"
      - description: "Rust Book - The Slice Type. Explains slices as references to contiguous sequences, including string slices (&str) and array slices (&[T])."
        resource: "https://doc.rust-lang.org/book/ch04-03-slices.html"
      - description: "Rustonomicon - Ownership and Lifetimes. Advanced guide to Rust's ownership system, covering unsafe code, variance, and subtyping."
        resource: "https://doc.rust-lang.org/nomicon/ownership.html"

  T5.2:
    family: RustLang
    type: related
    primary_task: T5.1
    prompt: "Find resources on Rust smart pointers - Box, Rc, Arc, RefCell and when to use each one."
    ground_truth:
      - paper: "Rust Book Smart Pointers"
        matchers:
          - "doc.rust-lang.org.*smart-pointers"
          - "Box<T>"
          - "Rc<T>"
          - "Arc<T>"
      - paper: "RefCell docs"
        matchers:
          - "RefCell"
          - "interior mutability"
          - "borrow.*runtime"
      - paper: "Arc docs"
        matchers:
          - "Arc<T>"
          - "atomic.*reference"
          - "thread.*safe.*Rc"
    success_threshold: 2

  # ===========================================
  # Task Family 6: TypeScript Type System
  # ===========================================

  T6.1:
    family: TypeScript
    type: primary
    prompt: "Find documentation on TypeScript generics - how to write generic functions, classes, and constraints."
    ground_truth:
      - paper: "TypeScript Generics docs"
        matchers:
          - "typescriptlang.org.*generics"
          - "Generic.*Types"
          - "<T>.*generic"
      - paper: "Generic Constraints"
        matchers:
          - "extends.*constraint"
          - "generic.*constraint"
          - "keyof"
      - paper: "Utility Types"
        matchers:
          - "Partial<"
          - "Required<"
          - "Pick<"
          - "Omit<"
          - "utility.*types"
    success_threshold: 2
    related_task: T6.2
    warm_index_entries:
      - description: "TypeScript Handbook - Generics. Explains generic type parameters, generic functions, generic classes, and generic constraints using extends keyword."
        resource: "https://www.typescriptlang.org/docs/handbook/2/generics.html"
      - description: "TypeScript Handbook - Utility Types. Built-in generic types: Partial<T>, Required<T>, Readonly<T>, Pick<T,K>, Omit<T,K>, Record<K,T>, etc."
        resource: "https://www.typescriptlang.org/docs/handbook/utility-types.html"
      - description: "TypeScript Handbook - Keyof Type Operator. The keyof operator takes an object type and produces a string or numeric literal union of its keys."
        resource: "https://www.typescriptlang.org/docs/handbook/2/keyof-types.html"
      - description: "TypeScript Handbook - Conditional Types. Types that select one of two possible types based on a condition: T extends U ? X : Y"
        resource: "https://www.typescriptlang.org/docs/handbook/2/conditional-types.html"
      - description: "TypeScript Handbook - Mapped Types. Create new types by transforming properties of existing types using in keyof syntax."
        resource: "https://www.typescriptlang.org/docs/handbook/2/mapped-types.html"

  T6.2:
    family: TypeScript
    type: related
    primary_task: T6.1
    prompt: "Find resources on TypeScript type narrowing and type guards - how to narrow types in conditional blocks."
    ground_truth:
      - paper: "TypeScript Narrowing docs"
        matchers:
          - "typescriptlang.org.*narrowing"
          - "type.*narrowing"
          - "type.*guard"
      - paper: "typeof guard"
        matchers:
          - "typeof.*narrowing"
          - "typeof.*guard"
          - "typeof x ==="
      - paper: "instanceof or discriminated unions"
        matchers:
          - "instanceof"
          - "discriminated.*union"
          - "tagged.*union"
          - "is.*type.*predicate"
    success_threshold: 2

  # ===========================================
  # Task Family 7: Python Async
  # ===========================================

  T7.1:
    family: PythonAsync
    type: primary
    prompt: "Find documentation on Python async/await - asyncio basics, coroutines, and running async code."
    ground_truth:
      - paper: "Python asyncio docs"
        matchers:
          - "docs.python.org.*asyncio"
          - "asyncio.*coroutine"
          - "async.*await.*Python"
      - paper: "Coroutines"
        matchers:
          - "coroutine"
          - "async def"
          - "await.*expression"
      - paper: "Event loop"
        matchers:
          - "event.*loop"
          - "asyncio.run"
          - "asyncio.get_event_loop"
    success_threshold: 2
    related_task: T7.2
    warm_index_entries:
      - description: "Python asyncio documentation - High-level APIs for async/await. Covers asyncio.run(), creating tasks, sleeping, running coroutines concurrently with gather()."
        resource: "https://docs.python.org/3/library/asyncio.html"
      - description: "Python asyncio - Coroutines and Tasks. Explains coroutines (async def), awaitables, creating tasks with create_task(), and task cancellation."
        resource: "https://docs.python.org/3/library/asyncio-task.html"
      - description: "Python asyncio - Event Loop. Low-level API for the event loop, running and stopping loops, scheduling callbacks."
        resource: "https://docs.python.org/3/library/asyncio-eventloop.html"
      - description: "Real Python - Async IO in Python. Comprehensive tutorial covering async/await syntax, asyncio module, and practical examples."
        resource: "https://realpython.com/async-io-python/"
      - description: "Python asyncio - Streams. High-level async/await-ready primitives for working with network connections (StreamReader, StreamWriter)."
        resource: "https://docs.python.org/3/library/asyncio-stream.html"

  T7.2:
    family: PythonAsync
    type: related
    primary_task: T7.1
    prompt: "Find resources on Python asyncio synchronization primitives - locks, semaphores, and queues for async code."
    ground_truth:
      - paper: "asyncio Lock"
        matchers:
          - "asyncio.Lock"
          - "async.*lock"
          - "asyncio.*synchronization"
      - paper: "asyncio Semaphore"
        matchers:
          - "asyncio.Semaphore"
          - "asyncio.BoundedSemaphore"
          - "semaphore.*async"
      - paper: "asyncio Queue"
        matchers:
          - "asyncio.Queue"
          - "async.*queue"
          - "producer.*consumer.*async"
    success_threshold: 2

  # ===========================================
  # Unrelated Control Task
  # ===========================================

  T0:
    family: Unrelated
    type: unrelated_control
    prompt: "Find key research papers on cephalopod cognition and problem-solving abilities - how do octopuses, cuttlefish, and squid demonstrate intelligence?"
    ground_truth:
      - paper: "Godfrey-Smith 2016"
        matchers:
          - "Other Minds"
          - "Octopus.*Consciousness"
          - "Godfrey-Smith.*2016"
      - paper: "Hochner 2012"
        matchers:
          - "Embodied View of Octopus Neurobiology"
          - "10.1016/j.cub.2012.09.001"
          - "Hochner.*2012"
      - paper: "Schnell et al. 2021"
        matchers:
          - "Cuttlefish.*self-control"
          - "delay of gratification"
          - "10.1098/rspb.2020.3161"
          - "Schnell.*2021"
    success_threshold: 2
    # Used across all task families for unrelated-warm condition
